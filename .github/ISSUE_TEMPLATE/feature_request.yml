name: Feature request
description: Suggest a new capability for an existing plugin, or a new plugin.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin
      description: The plugin this concerns, or "new plugin".
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
